name: Build and package artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            pkg-config \
            xvfb

      - name: Download Go modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Build packages
        run: go build ./...

  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            binary: asteroids
            package: asteroids-linux-amd64
          - name: windows-amd64
            runner: windows-latest
            binary: asteroids.exe
            package: asteroids-windows-amd64
          - name: macos
            runner: macos-latest
            binary: asteroids
            package: asteroids-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            pkg-config \
            xvfb

      - name: Download Go modules
        run: go mod download

      - name: Run tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a go test ./...
          else
            go test ./...
          fi

      - name: Prepare artifact build metadata
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="pr-$PR_NUMBER"
          else
            version="dev-$commit"
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist package
          metadata_package="github.com/scottdensmore/asteroids/internal/game"
          ldflags="-s -w"
          ldflags+=" -X $metadata_package.version=$VERSION"
          ldflags+=" -X $metadata_package.commit=$COMMIT"
          ldflags+=" -X $metadata_package.buildDate=$BUILD_DATE"
          go build -trimpath \
            -ldflags="$ldflags" \
            -o "dist/$BINARY" ./cmd/asteroids

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -C dist -czf "package/$PACKAGE-$VERSION.tar.gz" "$BINARY"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path "dist/$env:BINARY" -DestinationPath "package/$env:PACKAGE-$env:VERSION.zip"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: package/*
          if-no-files-found: error
          retention-days: 3
