name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            binary: asteroids
            package: asteroids-linux-amd64
          - name: windows-amd64
            runner: windows-latest
            binary: asteroids.exe
            package: asteroids-windows-amd64
          - name: macos
            runner: macos-latest
            binary: asteroids
            package: asteroids-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            pkg-config \
            xvfb

      - name: Download Go modules
        run: go mod download

      - name: Run tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a go test ./...
          else
            go test ./...
          fi

      - name: Prepare version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          elif [[ "${{ github.ref_type }}" == "branch" ]]; then
            tag="v0.0.${{ github.run_number }}"
          else
            tag="pr-${{ github.event.pull_request.number }}"
          fi

          version="${tag#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist package
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit }} -X main.buildDate=${{ steps.version.outputs.build_date }}" \
            -o "dist/${{ matrix.binary }}" .

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "package/${{ matrix.package }}-${{ steps.version.outputs.version }}.tar.gz" "${{ matrix.binary }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "package/${{ matrix.package }}-${{ steps.version.outputs.version }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: package/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Ensure release tag exists
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number)) }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            exit 0
          fi

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number)) }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          fi
